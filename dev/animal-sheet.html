<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>animal sheet</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4efe4; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #grid { position: fixed; inset: 0; display: grid; pointer-events: none; }
    .cell { position: relative; border: 1px solid rgba(30, 30, 36, 0.12); }
    .cell span { position: absolute; left: 10px; bottom: 8px; font: 13px ui-monospace, Consolas, monospace; color: #55524a; }
    #help { position: fixed; right: 10px; top: 8px; font: 12px ui-monospace, Consolas, monospace; color: #8a867a; }
    body.bare .cell { border-color: transparent; }
    body.bare .cell span, body.bare #help { display: none; }
  </style>
</head>
<body>
  <!--
    Every animal in the kit on ONE sheet, each in its own cell, seen square
    from the side — a single image to screenshot and hand to something else
    (an image generator, a person) as "this is what they look like now".

    The view is orthographic: a perspective lens foreshortens the far legs and
    the rump differently on every animal, and a reference sheet should show
    proportions, not a lens. Each animal is fitted to its own cell, so the
    sheet does NOT show relative size; press S to put them all on one scale.

      V   side view / three-quarter / front / front three-quarter
      M   lit / flat-ink silhouette
      S   fit each cell / one shared scale
      L   labels and cell borders on / off (off for a clean screenshot)

    ?only=horse,buffalo narrows the sheet; ?view=34, ?view=front or
    ?view=front34 opens on that view. window.sheet.capture() returns the
    canvas as a dataURL for shot.js (use its url flag to open this page).

    The roster is the model viewer's own, so a new creature registered there
    appears here with no edit.
  -->
  <canvas id="c"></canvas>
  <div id="grid"></div>
  <div id="help">V view · M lit/ink · S scale · L labels</div>
  <script type="module">
    import * as THREE from '../lib/three.module.js';
    import * as KIT from '../src/kit/index.js';
    import { PAPER } from '../src/palette.js';
    import { ROSTER, instantiate } from '../src/modelviewer/roster.js';
    import { makeViewerLights } from '../src/modelviewer/lights.js';

    const params = new URLSearchParams(location.search);
    const only = (params.get('only') || '').split(',').filter(Boolean);
    // the flocks are a driver over the single bird and butterfly, not a form
    const FLOCKS = new Set(['birds', 'butterflies']);
    const entries = ROSTER.filter((e) => e.section === 'creatures' && !FLOCKS.has(e.key))
      .filter((e) => !only.length || only.includes(e.key));

    const canvas = document.getElementById('c');
    const grid = document.getElementById('grid');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setScissorTest(true);

    // yaw from the animal's own front (+z), pitch above level, in degrees.
    // Front-on is where an ear's or a horn's join to the skull shows, and a
    // side view hides it entirely.
    const VIEWS = { side: [90, 0], 34: [50, 14], front: [0, 0], front34: [22, 10] };
    const ORDER = ['side', '34', 'front', 'front34'];
    const state = {
      view: VIEWS[params.get('view')] ? params.get('view') : 'side',
      ink: params.get('mode') === 'silhouette',
      shared: params.has('shared'),
    };
    const INK = new THREE.MeshBasicMaterial({ color: 0x14110c });

    const cols = Math.min(entries.length, entries.length > 4 ? 3 : 2);
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.style.gridAutoRows = '1fr';

    const cells = entries.map((entry) => {
      const el = document.createElement('div');
      el.className = 'cell';
      const label = document.createElement('span');
      el.appendChild(label);
      grid.appendChild(el);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(PAPER);
      scene.add(makeViewerLights(KIT));
      let obj = null, error = null;
      try {
        ({ obj } = instantiate(entry, KIT));
        scene.add(obj);
        obj.traverse((o) => { if (o.isMesh) o.userData.lit = o.material; });
      } catch (e) {
        error = String(e && e.message || e);
      }
      label.textContent = error ? `${entry.key} — ${error}` : entry.key;
      const box = obj ? new THREE.Box3().setFromObject(obj) : new THREE.Box3();
      return { el, scene, obj, box, camera: new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 200) };
    });

    const size = new THREE.Vector3(), centre = new THREE.Vector3(), dir = new THREE.Vector3();
    const corner = new THREE.Vector3();
    // half-extents of a box as the camera sees it: right and up are the lens's own axes
    function extent(cell, right, up) {
      cell.box.getCenter(centre);
      let hx = 0, hy = 0;
      for (let i = 0; i < 8; i++) {
        corner.set(i & 1 ? cell.box.max.x : cell.box.min.x, i & 2 ? cell.box.max.y : cell.box.min.y, i & 4 ? cell.box.max.z : cell.box.min.z).sub(centre);
        hx = Math.max(hx, Math.abs(corner.dot(right)));
        hy = Math.max(hy, Math.abs(corner.dot(up)));
      }
      return { hx, hy };
    }

    function draw() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      renderer.setScissor(0, 0, w, h);
      renderer.setViewport(0, 0, w, h);
      renderer.setClearColor(PAPER);
      renderer.clear();

      // every kit animal faces +z; from +x that is nose to the LEFT
      const yaw = VIEWS[state.view][0] * Math.PI / 180;
      const pitch = VIEWS[state.view][1] * Math.PI / 180;
      dir.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));

      const MARGIN = 1.22;
      const fits = cells.map((cell) => {
        if (!cell.obj) return null;
        cell.box.getCenter(centre);
        cell.camera.position.copy(centre).addScaledVector(dir, 50);
        cell.camera.lookAt(centre);
        cell.camera.updateMatrixWorld(true);
        const right = new THREE.Vector3().setFromMatrixColumn(cell.camera.matrixWorld, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(cell.camera.matrixWorld, 1);
        const r = cell.el.getBoundingClientRect();
        const { hx, hy } = extent(cell, right, up);
        // world units per pixel needed to hold this animal in this cell
        return { r, per: Math.max(hx * MARGIN / (r.width / 2), hy * MARGIN / (r.height / 2)) };
      });
      const sharedPer = Math.max(...fits.filter(Boolean).map((f) => f.per));

      cells.forEach((cell, i) => {
        const fit = fits[i];
        if (!fit) return;
        const { r } = fit;
        const per = state.shared ? sharedPer : fit.per;
        const c = cell.camera;
        c.left = -per * r.width / 2; c.right = per * r.width / 2;
        c.top = per * r.height / 2; c.bottom = -per * r.height / 2;
        c.updateProjectionMatrix();
        cell.obj.traverse((o) => { if (o.isMesh) o.material = state.ink ? INK : o.userData.lit; });
        const y = h - r.bottom;
        renderer.setViewport(r.left, y, r.width, r.height);
        renderer.setScissor(r.left, y, r.width, r.height);
        renderer.render(cell.scene, c);
      });
    }

    addEventListener('resize', draw);
    addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'v') state.view = ORDER[(ORDER.indexOf(state.view) + 1) % ORDER.length];
      else if (k === 'm') state.ink = !state.ink;
      else if (k === 's') state.shared = !state.shared;
      else if (k === 'l') document.body.classList.toggle('bare');
      else return;
      draw();
    });
    draw();

    window.sheet = {
      state, draw,
      capture() { draw(); return canvas.toDataURL('image/jpeg', 0.92); },
    };
  </script>
</body>
</html>
