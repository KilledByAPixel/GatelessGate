<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kit Preview — The Gateless Gate</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #EDE7D8; }
    #hud { position: fixed; top: 8px; left: 10px; font: 12px/1.4 system-ui, sans-serif; color: #3a352c; white-space: pre; }
  </style>
</head>
<body>
  <div id="hud">kit preview — window.kp.step(n) / kp.view(name) / kp.shot('name') / kp.shotAll('prefix')</div>
  <script type="module">
    import * as THREE from '../lib/three.module.js';
    import { PAPER, INK, ACCENT_DEEP } from '../src/palette.js';
    import {
      makeDog, makeBuffalo, makeBuddha, makeMonk, makeFlower, makeBowl,
      makeWater, makeHut, makeLattice, makeAssembly, makeLights, addOutlines,
      toonMaterial,
      makeFox, makeCat, makeHorse, makeKoi, makeBird, makeBirds,
      makeHangingMonk, makeRaisedFinger,
      makeTree, makePine, makeOak, makeForest, makeGrassField, makeTuftField, makeWildflowers,
      makeGate, makeVeranda, makeLantern, makeBell, makeDrum, makeStall,
      makeBasin, makeFurin, makeWheel, makeVase, makeRack, makePole, makeBundle,
    } from '../src/kit/index.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(PAPER);
    scene.fog = new THREE.FogExp2(PAPER, 0.012);
    scene.add(makeLights());

    // flat ground so every piece is judged against y=0
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(220, 220),
      toonMaterial({ color: '#CFC7B2' }));
    ground.rotation.x = -Math.PI / 2;
    ground.userData.noOutline = true;
    scene.add(ground);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 260);

    // place a piece at (x,z); accepts a Group/Mesh or a {group}/{mesh} handle.
    // soloKey (string or array of strings) registers the placed object under
    // one or more VIEWS keys for kp.solo(name) — paired placements (koi +
    // its water, the hanging monk + its oak) share a key so they solo together.
    const animated = [];
    const allPlaced = [];
    const soloGroups = {}; // VIEWS key -> [Object3D, ...]
    function place(thing, x, z, ry = 0, soloKey) {
      const obj = thing.isObject3D ? thing : (thing.group || thing.mesh);
      obj.position.set(x, 0, z);
      obj.rotation.y = ry;
      scene.add(obj);
      if (thing.update) animated.push(thing);
      allPlaced.push(obj);
      if (soloKey) {
        for (const k of Array.isArray(soloKey) ? soloKey : [soloKey]) {
          (soloGroups[k] || (soloGroups[k] = [])).push(obj);
        }
      }
      return thing;
    }

    // row A — creatures & figures (front)
    place(makeDog({}), -11, 0, 0.6, 'dog');
    const buffalo = place(makeBuffalo({}), -6.2, 0.2, 0.5, 'buffalo');
    place(makeBuddha({}), -1.2, 0, 0, 'buddha');
    place(makeMonk({ pose: 'sit' }), 2.4, 0, 0, 'figures');
    place(makeMonk({ pose: 'sit', elder: true }), 4.6, 0, -0.2, 'figures');
    // reference standing monk. Also keyed 'monk-side' so B1 can solo HIM alone
    // for a true profile — the 'figures' view is a 3/4 group shot and can't
    // show the robe's silhouette (collar, waist, hem flare) edge-on.
    place(makeMonk({ pose: 'point' }), 6.8, 0, -0.3, ['figures', 'monk-side']);
    place(makeAssembly({ count: 8, radius: 2.2, center: [11, -1.5], facing: [11, 3] }), 0, 0, 0, 'figures');

    // row B — props (back)
    place(makeFlower({}), -11, 5, 0, 'flower');
    place(makeBowl({}), -8, 5, 0);
    const water = place(makeWater({ size: 2.4 }), -4.6, 5.4, 0, 'water');
    place(makeHut({}), 0.5, 6.5, 0, 'hut');
    place(makeLattice({}), 5.5, 5.5, 0.15);

    // row C — the second chapter's creatures & small figures (z ≈ -6)
    // handle kept (like buffalo/water below) so a diagnostic script can drive
    // fox.notice() directly from the console when judging the ear-flick /
    // head-turn / brush-sweep response, the same behavior k2.js wires to a tap
    const fox = place(makeFox({}), -16, -6, 0.5, 'fox');
    // handle kept the same way, for kp.cat.stir() — the tail-curl/ear-swivel
    // response k14.js wires to a tap, judged in A6 the same way A5 judged
    // fox.notice()
    const cat = place(makeCat({}), -13, -6, -0.4, 'cat');
    place(makeHorse({}), -8, -6, 0.2, 'horse');

    // a small round pond so the koi have a surface to ride — lifted clear of
    // the flat preview ground (y=0), since the koi swim just BELOW the water's
    // own local surface and would otherwise sink invisibly into the ground
    // plane, which (unlike a real basin) has no recess for them
    const water2 = place(makeWater({ shape: 'round', size: 2.3, opacity: 0.55 }), -3, -6.4, 0, 'koi');
    water2.group.position.y = 0.16;
    const koi = place(makeKoi({ count: 4, radius: 0.85, surfaceAt: water2.heightAt }), -3, -6.4, 0, 'koi');
    koi.group.position.y = 0.16;

    const bird = place(makeBird({ size: 0.5 }), 1, -6, 0, 'bird');
    bird.group.position.y = 1.4;

    place(makeBirds({ count: 6, seed: 24, center: [0, 0], height: 6.2, spread: 4 }), 6, -8, 0, 'birds');

    place(makeRaisedFinger({}), 10, -6, 0, 'finger');

    // row D — vegetation (z ≈ 14). Pushed back from the original z≈12 plan,
    // and the forest's footprint kept modest (spread 3.5, not 5) — the wider
    // draft's scatter radius reached clear into row B's hut and row E's stall,
    // which shared its x, and the two rows visibly collided in the wide shot.
    place(makeTree({ height: 3.2 }), -16, 14, 0, 'tree');
    place(makePine({ height: 4 }), -11, 14, 0, 'pine');
    // makeForest's `center` is [x, _, z] (three elements — see forest.js,
    // which reads center[0]/center[2]); a 2-element array leaves center[2]
    // undefined and every instance position comes out NaN (invisible)
    place(makeForest({ center: [0, 0, 0], spread: 3.5, count: 22, treeH: 2.2 }), -4, 14, 0, 'forest');
    // count kept close to the real game's per-area density (radius 20 / count
    // 52000 in production) rather than the naive scale-down, which packed the
    // blades ~3x too dense and read as a solid black mass
    place(makeGrassField({ radius: 3.2, count: 1300 }), 5, 14, 0, 'grassfield');
    // the production grass renderer (composeWorld's default) — offset a touch in
    // z from grassfield's own slot so the two patches don't overlap in the wide
    // overview shot; had no workbench view at all before this task (the gap the
    // task brief calls out)
    place(makeTuftField({ radius: 3.2, count: 900 }), 8.5, 17, 0, 'tuftfield');
    place(makeWildflowers({ radius: 2.3, count: 70 }), 12, 14, 0, 'wildflowers');

    // the oak (case 38) and, hung from one of its outer canopy anchors, the
    // hanging monk (case 5) — a real branch tip rather than a hand-picked point,
    // so he previews in his true dangling attitude
    const oak = place(makeOak({ height: 5.2, seed: 5 }), 19, 15, 0.3, ['oak', 'hangingmonk', 'hangingmonk-side']);
    oak.updateMatrixWorld(true);
    const branchTip = oak.localToWorld(oak.canopyPoints[0].clone());
    // the accent colour (as case 5 itself uses) — plain ink would blend into
    // the trunk/canopy's own dark grey and vanish against the crown
    const dangler = makeHangingMonk({ height: 1.6, color: ACCENT_DEEP });
    dangler.group.position.copy(branchTip);
    scene.add(dangler.group);
    if (dangler.update) animated.push(dangler);
    // paired with the oak he hangs from — registered directly (not via
    // place()) since he's added outside that helper — so solo('oak') and
    // solo('hangingmonk') both keep the pair visible together
    allPlaced.push(dangler.group);
    soloGroups.oak.push(dangler.group);
    soloGroups.hangingmonk.push(dangler.group);
    soloGroups['hangingmonk-side'].push(dangler.group);

    // row E — architecture & staged objects (z ≈ 22 — pushed back 2 from the
    // original z≈20 plan for clearance from row D's forest, see above)
    place(makeGate({}), -30, 22, 0, 'gate');
    place(makeVeranda({}), -23, 22, 0, 'veranda');
    place(makeLantern({}), -17, 22, 0, 'lantern');
    place(makeBell({}), -12, 22, 0, 'bell');
    place(makeDrum({}), -7, 22, 0, 'drum');
    place(makeStall({}), -2, 22, 0, 'stall');
    place(makeBasin({}), 2, 22, 0, 'basin');
    // sized up from the default (0.17) so the tiny chime reads at all from a
    // workbench distance; hung at a plausible eave height
    const furin = place(makeFurin({ size: 0.5 }), 6, 22, 0, 'furin');
    furin.group.position.y = 1.7;
    place(makeWheel({}), 10, 22, 0, 'wheel');
    place(makeVase({}), 14, 22, 0, 'vase');
    place(makeRack({}), 17, 22, 0, 'rack');
    place(makePole({}), 24, 22, 0, 'pole');
    place(makeBundle({}), 30, 22, 0, 'bundle');

    // ?ink=0 skips the inverted-hull outline pass entirely, for judging shots
    // that want raw silhouette/form with no ink dressing on top. Default
    // (param absent, or anything other than the literal '0') is unchanged.
    const inkOn = new URLSearchParams(location.search).get('ink') !== '0';
    if (inkOn) addOutlines(scene, { width: 0.035, wobble: 0.7 });

    const VIEWS = {
      wide:    { p: [0, 26, 100], t: [0, 2, 9] },
      rowA:    { p: [-2, 4.5, 12], t: [-2, 1.1, 0] },
      rowB:    { p: [-3, 4.5, 14], t: [-3, 1.1, 5.5] },
      // The quadrupeds are judged on SILHOUETTE, and the first framing of these
      // two looked steeply DOWN on them from four model-heights away: the dog
      // filled 13% of the frame and the buffalo's legs were cropped off the
      // bottom edge, so neither shot could show whether a leg was a leg or a
      // table stick. Both are now a slightly-low 3/4 front view (camera just
      // under the withers, ~37 degrees off the model's own facing), pulled in
      // until the animal fills ~60% of the frame height. Reframed BEFORE any
      // kit edit, and both before-shots retaken from here.
      buffalo: { p: [-2.37, 0.85, 1.92], t: [-6.2, 1.05, 0.2] },
      dog:     { p: [-9.66, 0.28, 0.45], t: [-11, 0.36, 0] },
      // profile view, added for A4 (dog.js): the near view's 3/4 angle can't
      // show the haunch/chest masses or the tail's cocked-up curl
      // unambiguously — same trap A2/A3 flagged for horn/neck work. Formula
      // per A1's report, calibrated the way A3 did: camera sits at the
      // model's own placement position, offset along its local +x (the
      // "right" side, i.e. (cos ry, 0, -sin ry)) by the near view's own
      // distance, at the near view's own eye height —
      // `(x + d*cos(ry), eye, z - d*sin(ry))` looking at the near view's own
      // target. dog is placed at (-11, 0, 0) with ry=0.6; near view distance
      // d = |(-9.66,0.45) - (-11,0)| = 1.4136.
      'dog-side': { p: [-9.8334, 0.28, -0.7981], t: [-11, 0.36, 0] },
      buddha:  { p: [-1.2, 3.2, 5], t: [-1.2, 1.4, 0] },
      // profile view, added for B2 (buddha.js): the near view looks straight
      // at the front (ry=0, no x offset) and can't show the shoulder/lap
      // silhouette (the mountain triangle), the fold rings' depth, or the ear
      // lobes' projection unambiguously — the same trap A1-A7 flagged for
      // legs/tails/knees on the quadrupeds. Formula per those tasks, buddha's
      // own case since ry=0: camera sits at the model's own placement
      // position, offset along local +x by the near view's own distance, at
      // the near view's own eye/target heights — buddha is placed at
      // (-1.2, 0, 0); near view distance d = |(-1.2,3.2,5) - (-1.2,1.4,0)| =
      // 5.3141.
      'buddha-side': { p: [4.1141, 3.2, 0], t: [-1.2, 1.4, 0] },
      figures: { p: [3.5, 3.4, 8], t: [3.5, 1.2, -0.1] },
      // profile view of the reference standing monk, added for B1 (figure.js).
      // A person's "side" is perpendicular to the way he FACES, and a monk
      // faces local +x (aimMonk's convention), so this offsets along local +z
      // — `(x + d*sin(ry), eye, z + d*cos(ry))` — not along +x the way the
      // quadruped side views do. Monk is placed at (6.8, 0, -0.3), ry = -0.3,
      // d = 3.0: a true edge-on read of the robe silhouette.
      'monk-side': { p: [5.9134, 1.10, 2.5659], t: [6.8, 0.90, -0.3] },
      water:   { p: [-4.6, 3.2, 9.5], t: [-4.6, 0.4, 5.4] },
      hut:     { p: [0.5, 4.2, 11.5], t: [0.5, 1.5, 6.5] },
      // flower/bowl/lattice had no dedicated view (a ledgered gap) — this task
      // adds flower's. A held bloom's petals splay outward and slightly UP
      // from the pod (RINGS.tilt in flower.js), so a level eye-height camera
      // sees most of them edge-on as thin spikes; a bit of elevation looking
      // DOWN onto the bloom (the way anyone actually looks at a held flower)
      // shows each petal's true widened face instead. flower is placed at
      // (-11, 5, 0) with no rotation; offset (0.6, 0.60, 0.35) from the pod.
      flower:      { p: [-10.4, 1.15, 5.35], t: [-11, 0.55, 5.05] },
      // profile view: the near view has no established "facing" to offset from
      // (a flower has none, same reasoning `finger-side` used), so this rotates
      // the near view's own camera offset 90 degrees around the target — same
      // formula as `finger-side`: (dx, dy, dz) -> (-dz, dy, dx).
      'flower-side': { p: [-11.35, 1.15, 5.6], t: [-11, 0.55, 5.05] },

      // row C — creatures
      fox:     { p: [-16.9, 0.45, -4.6], t: [-16, 0.30, -6] },
      cat:     { p: [-13.8, 0.42, -4.7], t: [-13, 0.28, -6] },
      horse:   { p: [-9.6, 1.30, -2.8], t: [-8, 1.00, -6] },
      // profile view, added for A3 (horse.js): the near view's 3/4 angle
      // can't show the tail or the neck's forward lean unambiguously — the
      // same trap A1's report flagged for leg work. Formula per that report:
      // camera sits at the model's own placement position, offset along its
      // local +x (the "right" side, i.e. (cos ry, 0, -sin ry)) by the near
      // view's own distance, at the near view's own eye/target heights —
      // `(x + d*cos(ry), eye, z - d*sin(ry))` looking at `(x, ty, z)`.
      'horse-side': { p: [-4.4815, 1.30, -6.7132], t: [-8, 1.00, -6] },
      // profile view, added for A5 (fox.js): the near view's 3/4 angle can't
      // show the hind knee's fold or the brush's root thickness against the
      // barrel unambiguously — the same trap A3/A4 flagged for tail/leg work.
      // Formula per that report: camera sits at the model's own placement
      // position, offset along its local +x (the "right" side, i.e.
      // (cos ry, 0, -sin ry)) by the near view's own distance, at the near
      // view's own eye height — `(x + d*cos(ry), eye, z - d*sin(ry))` looking
      // at the near view's own target. fox is placed at (-16, 0, -6) with
      // ry=0.5; near view distance d = |(-16.9,0.45,-4.6) - (-16,0.30,-6)| =
      // 1.6711.
      'fox-side': { p: [-14.5335, 0.45, -6.8012], t: [-16, 0.30, -6] },
      // profile view, added for A6 (cat.js): the near view's front-on 3/4
      // angle can't show the haunch-high/shoulder-low crouch or the tail's
      // curl unambiguously — the same trap A3/A4/A5 flagged for neck/tail/
      // knee work. Formula per those tasks: camera sits at the model's own
      // placement position, offset along its local +x (the "right" side,
      // i.e. (cos ry, 0, -sin ry)) by the near view's own distance, at the
      // near view's own eye height — `(x + d*cos(ry), eye, z - d*sin(ry))`
      // looking at the near view's own target. cat is placed at (-13, 0, -6)
      // with ry=-0.4; near view distance d = |(-13.8,0.42,-4.7) -
      // (-13,0.28,-6)| = 1.5328.
      'cat-side': { p: [-11.5882, 0.42, -5.4031], t: [-13, 0.28, -6] },
      koi:     { p: [-3.9, 1.10, -4.6], t: [-3, 0.20, -6.4] },
      // profile view, added for A7 (koi.js): the near view's 3/4-from-above
      // angle can't show the body's nose-to-tail taper or the travelling
      // flex through the peduncle/tail joints unambiguously — the same trap
      // A3-A6 flagged for neck/tail/knee/haunch work. Formula per those
      // tasks: camera sits at the model's own placement position, offset
      // along its local +x (the "right" side, i.e. (cos ry, 0, -sin ry)) by
      // the near view's own distance, at the near view's own eye height —
      // `(x + d*cos(ry), eye, z - d*sin(ry))` looking at the near view's own
      // target. the koi group is placed at (-3, -6.4, 0.16) with ry=0; near
      // view distance d = |(-3.9,1.10,-4.6) - (-3,0.20,-6.4)| = 2.2045.
      'koi-side': { p: [-0.7955, 1.10, -6.4], t: [-3, 0.20, -6.4] },
      // seen from below, the way this kit's birds are actually staged (see
      // birds.js: "birds seen from below") — a level eye-height shot presents
      // the bird nearly edge-on, since its spread silhouette lies flat
      bird:    { p: [-0.3, 0.40, -4.2], t: [1, 1.40, -6] },
      // profile view, added for A7 (bird.js): the near view is already a
      // side-on angle, but low and close; this pulls back to the near view's
      // own distance so the whole wing sweep/fold is visible without the
      // wingtip clipping the frame. Same formula as koi-side above. the bird
      // is placed at (1, -6, 1.4) with ry=0; near view distance
      // d = |(-0.3,0.40,-4.2) - (1,1.40,-6)| = 2.4352.
      'bird-side': { p: [3.4352, 0.40, -6], t: [1, 1.40, -6] },
      birds:   { p: [3.0, 4.50, -1.0], t: [6, 6.00, -8] },
      finger:  { p: [10.6, 0.22, -5.4], t: [10, 0.08, -6] },
      // profile view, added for B4 (finger.js). The finger has no established
      // "facing" the way a monk or quadruped does (it's a lathe standing
      // straight up), so rather than reuse the local-+x-offset formula those
      // models anchor to a walking/aiming direction, this rotates the near
      // view's own camera offset by 90 degrees around the target (the finger
      // is placed at (10, 0, -6) with ry=0; near view offset from target is
      // (0.6, 0.14, 0.6) — rotated to (-0.6, 0.14, 0.6), same distance and
      // height, a genuinely different azimuth so the nail plane and knuckle
      // steps are checked from both sides).
      'finger-side': { p: [9.4, 0.22, -5.4], t: [10, 0.08, -6] },

      // row D — vegetation
      tree:        { p: [-19.5, 2.2, 19.5], t: [-16, 1.5, 14] },
      pine:        { p: [-14.5, 2.3, 20.0], t: [-11, 1.9, 14] },
      forest:      { p: [-8, 3.0, 21], t: [-4, 1.8, 14] },
      grassfield:  { p: [2, 1.6, 21], t: [5, 0.3, 14.5] },
      // same relative camera offset as grassfield's own view, carried over to
      // the tuft field's placement — no dedicated view existed for this model
      // before this task, the gap the brief calls out (composeWorld's actual
      // default grass renderer had never been seen in the workbench at all).
      tuftfield:   { p: [5.5, 1.6, 24], t: [8.5, 0.3, 17.5] },
      wildflowers: { p: [10, 1.3, 20], t: [12, 0.3, 14.5] },
      oak:         { p: [10, 4.0, 25], t: [19, 3.0, 15] },
      // hangingmonk view is set below, once the branch tip is known

      // row E — architecture & staged objects
      gate:    { p: [-27, 1.6, 27], t: [-30, 1.3, 22] },
      veranda: { p: [-19, 2.0, 30], t: [-23, 1.6, 24] },
      lantern: { p: [-15.5, 0.75, 24.6], t: [-17, 0.55, 22] },
      bell:    { p: [-9.6, 1.5, 26], t: [-12, 1.2, 22] },
      drum:    { p: [-5, 1.3, 25], t: [-7, 0.9, 22] },
      stall:   { p: [0.5, 1.4, 26.5], t: [-2, 1.0, 22.6] },
      basin:   { p: [4.5, 0.42, 25], t: [2, 0.30, 22] },
      furin:   { p: [7.0, 1.9, 23.3], t: [6, 1.65, 22] },
      wheel:   { p: [12, 1.3, 25.5], t: [10, 1.0, 22] },
      vase:    { p: [15.2, 0.55, 23.8], t: [14, 0.35, 22] },
      rack:    { p: [20.5, 1.2, 26], t: [17, 0.8, 22] },
      pole:    { p: [14, 2.4, 32], t: [24, 3.5, 22] },
      bundle:  { p: [31.2, 0.4, 23.6], t: [30, 0.2, 22] },
    };
    // 'horse-side' is the same model as 'horse', just a different camera —
    // solo() keys off soloGroups, not VIEWS, so it needs its own entry
    // pointing at the same placed object(s) or solo('horse-side') would hide
    // everything.
    soloGroups['horse-side'] = soloGroups.horse;
    soloGroups['dog-side'] = soloGroups.dog;
    soloGroups['fox-side'] = soloGroups.fox;
    soloGroups['cat-side'] = soloGroups.cat;
    soloGroups['koi-side'] = soloGroups.koi;
    soloGroups['bird-side'] = soloGroups.bird;
    soloGroups['buddha-side'] = soloGroups.buddha;
    soloGroups['finger-side'] = soloGroups.finger;
    soloGroups['flower-side'] = soloGroups.flower;

    // below and out from his anchor, looking up across the canopy's underside
    // rather than into it — the anchor sits ON the crown mass, so a close
    // offset stays buried in leaf geometry
    VIEWS.hangingmonk = {
      p: [branchTip.x + 5.5, branchTip.y - 0.6, branchTip.z + 5.5],
      t: [branchTip.x, branchTip.y - 1.0, branchTip.z],
    };
    // a true profile: he faces local -z (the bite offset is forward on -z),
    // so his side is perpendicular to that — offset along x alone rather
    // than the 3/4 diagonal above, same distance and target
    VIEWS['hangingmonk-side'] = {
      p: [branchTip.x + 7.0, branchTip.y - 0.3, branchTip.z],
      t: [branchTip.x, branchTip.y - 1.0, branchTip.z],
    };

    let simTime = 0;
    function setView(name) {
      const v = VIEWS[name] || VIEWS.wide;
      camera.position.set(...v.p);
      camera.lookAt(...v.t);
      render();
    }
    function render() { renderer.render(scene, camera); }
    function step(n = 1) {
      for (let i = 0; i < n; i++) {
        simTime += 1 / 60;
        for (const a of animated) a.update(1 / 60, simTime);
        if (i % 90 === 0 && water.ripple) water.ripple((Math.sin(i) * 0.5), (Math.cos(i) * 0.5));
      }
      render();
    }
    // views that survey more than one model at once — solo() leaves everyone
    // visible for these, same as solo(null)
    const OVERVIEW_VIEWS = new Set(['wide', 'rowA', 'rowB']);
    // kp.solo(name) hides every placed top-level object except the one(s)
    // registered under that VIEWS key — paired placements (koi + its water,
    // the hanging monk + its oak) were registered under both keys and so
    // stay visible together. The ground plane is never touched.
    // kp.solo(null) restores everything.
    function solo(name) {
      if (name == null) {
        for (const obj of allPlaced) obj.visible = true;
        render();
        return;
      }
      const keep = new Set(soloGroups[name] || []);
      for (const obj of allPlaced) obj.visible = keep.has(obj);
      render();
    }
    async function shot(name = 'kit') {
      const url = renderer.domElement.toDataURL('image/jpeg', 0.85);
      try {
        const r = await fetch('http://localhost:8106/' + name, { method: 'POST', body: url });
        return await r.text();
      } catch (e) { return 'post-failed: ' + e.message; }
    }
    async function shotAll(prefix = 'kit') {
      const out = [];
      for (const name of Object.keys(VIEWS)) {
        solo(OVERVIEW_VIEWS.has(name) ? null : name);
        setView(name); step(1);
        out.push(await shot(`${prefix}-${name}`));
      }
      solo(null);
      return out;
    }

    window.kp = { renderer, scene, camera, render, step, shot, view: setView, shotAll, solo, buffalo, water, fox, cat, koi, bird, THREE };

    // real-browser convenience: gentle auto-orbit (paused in headless previews, which is fine)
    let t0 = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
      simTime += dt;
      for (const a of animated) a.update(dt, simTime);
      render();
    }
    setView('wide');
    requestAnimationFrame(loop);
    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
