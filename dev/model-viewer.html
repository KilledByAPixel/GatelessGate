<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>model viewer</title>
  <!-- Absolute repo path for click-to-edit: the source-file link in the
       sidebar (and a cell's name in the gallery) opens the model's builder
       in VS Code via vscode://file/. On a machine where this path is wrong,
       clicking falls back to copying the repo-relative path instead. -->
  <meta name="mv-root" content="c:/dev/claude/gateless_gate">
  <!--
    Standalone art-iteration tool (see src/modelviewer/main.js). It loads the
    KIT BUILDERS only — never the game — and shows every model in the roster
    with hot reload: edit any kit source file and the view rebuilds in ~1s.

      #<key>      single view of that model      #gallery   the whole roster
      ?sweep      build+dispose everything once, result on window.__mvSweepResult

    Keys: up/down step models · drag orbit · wheel zoom · T turntable
          R reset view · S silhouette · L fill lights · G gallery

    Shading is the book's SHIPPED look — plain Lambert, because the book runs
    with the toon toggle off (debug.js). L adds/removes two dim tinted fills
    that are the viewer's own, for the far side of an orbit; off is the book's
    rig alone. See src/modelviewer/shading.js for why that matters.
    Serve over HTTP (npx -y http-server -p 8105 -c-1 .) — ES modules and the
    hot-reload poll both fail from file://. The page lives in dev/ with the
    other harnesses; its code is still src/modelviewer/ because the roster
    there is shared with dev/model-shot.html and unit-tested.
  -->
  <style>
    :root {
      --paper: #F3EDDF; --ink: #1E1E24; --line: #d8d0bf;
      --mid: #5a5348; --accent: #C73E3A; --ok: #4a7a4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink); overflow: hidden;
      font: 13px/1.45 ui-monospace, Consolas, monospace;
    }
    button {
      font: inherit; color: var(--mid); background: transparent;
      border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; cursor: pointer;
    }
    button:hover { border-color: var(--mid); }
    button.on { color: var(--paper); background: var(--mid); border-color: var(--mid); }
    input {
      font: inherit; color: var(--ink); background: transparent;
      border: none; border-bottom: 1px solid var(--line); padding: 3px 2px; outline: none;
    }
    input:focus { border-bottom-color: var(--mid); }

    /* ---- single view ---- */
    #view { position: fixed; top: 0; left: 240px; z-index: 1; display: block; }
    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 240px; z-index: 3;
      display: flex; flex-direction: column;
      background: var(--paper); border-right: 1px solid var(--line);
    }
    #side-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
    #side-title { font-weight: bold; margin-bottom: 6px; }
    #side-actions { display: flex; gap: 6px; }
    #side-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .side-section {
      padding: 8px 12px 2px; color: var(--mid); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .row {
      display: flex; align-items: center; gap: 8px;
      padding: 2px 12px; cursor: pointer; white-space: nowrap;
    }
    .row:hover { background: #ece5d3; }
    .row.sel { background: var(--ink); color: var(--paper); }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; flex: none;
      border: 1px solid var(--line);
    }
    .dot.ok { background: var(--ok); border-color: var(--ok); }
    .dot.needs { background: var(--accent); border-color: var(--accent); }
    #side-feedback {
      padding: 8px 12px 10px; border-top: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 6px;
    }
    #fb-file {
      color: var(--mid); font-size: 11px; cursor: pointer;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #fb-file:hover { text-decoration: underline; color: var(--ink); }
    #fb-file:empty { display: none; }
    .cell-key { cursor: pointer; }
    .cell-key:hover { text-decoration: underline; }
    #side-feedback > div { display: flex; gap: 6px; }
    #fb-ok.on { background: var(--ok); border-color: var(--ok); color: var(--paper); }
    #fb-needs.on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
    #fb-note { width: 100%; }

    #hud {
      position: fixed; right: 10px; bottom: 8px; z-index: 3;
      color: var(--mid); font-size: 11px; pointer-events: none;
    }
    #err {
      position: fixed; left: 260px; top: 12px; z-index: 3; display: none;
      background: var(--accent); color: var(--paper); padding: 6px 12px; border-radius: 3px;
      max-width: 60ch;
    }
    #toast {
      position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
      z-index: 20; background: var(--ink); color: var(--paper);
      padding: 5px 14px; border-radius: 3px; opacity: 0; transition: opacity 0.18s;
      pointer-events: none;
    }
    #toast.show { opacity: 0.92; }
    #toast.bad { background: var(--accent); opacity: 0.97; }

    /* ---- gallery ---- */
    #gallery-canvas { position: fixed; inset: 0; z-index: 4; display: none; }
    #gallery {
      position: fixed; inset: 0; z-index: 5; display: none; overflow-y: auto;
    }
    #gallery-head {
      position: sticky; top: 0; z-index: 6; display: flex; gap: 14px; align-items: center;
      padding: 10px 16px; background: var(--paper); border-bottom: 1px solid var(--line);
    }
    #gallery-title { color: var(--mid); }
    #gallery-export { margin-left: auto; }
    #gallery-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px; padding: 12px 16px 40px;
    }
    .cell-section {
      grid-column: 1 / -1; padding-top: 10px; color: var(--mid); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .cell {
      /* transparent: the render canvas is BEHIND the grid — any card
         background would veil the model */
      background: transparent; border: 1px solid var(--line); border-radius: 4px;
      height: 250px; display: flex; flex-direction: column; padding: 6px 8px;
    }
    .cell-top { display: flex; align-items: center; justify-content: space-between; }
    .cell-key { font-weight: bold; }
    .cell-marks { display: flex; gap: 4px; }
    .cell-marks button { padding: 0 6px; font-size: 11px; }
    .mark-ok.on { background: var(--ok); border-color: var(--ok); color: var(--paper); }
    .mark-needs.on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
    .cell-view { flex: 1; }
    .cell-view.cell-err { color: var(--accent); font-size: 11px; overflow: hidden; }
    .cell-note { width: 100%; font-size: 12px; }
    #gallery-export-fallback {
      position: fixed; left: 50%; top: 20%; transform: translateX(-50%); z-index: 30;
      background: var(--paper); border: 1px solid var(--mid); border-radius: 4px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    #gallery-export-fallback textarea {
      width: 60ch; height: 16em; font: 12px/1.4 ui-monospace, Consolas, monospace;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="side-head">
      <div id="side-title">model viewer</div>
      <div id="side-actions">
        <button id="btn-gallery" title="G">gallery</button>
        <button id="btn-sil" title="S">silhouette</button>
        <button id="btn-turn" title="T">turntable</button>
        <button id="btn-lights" title="L — off shows the book's own rig alone">fills</button>
      </div>
    </div>
    <div id="side-list"></div>
    <div id="side-feedback">
      <div id="fb-file" title="open in VS Code"></div>
      <div><button id="fb-ok">&#10003; ok</button><button id="fb-needs">&#10005; needs work</button></div>
      <input id="fb-note" placeholder="note&hellip;">
    </div>
  </div>
  <div id="err"></div>
  <div id="hud">&uarr;&darr; model &middot; drag orbit &middot; wheel zoom &middot; T turntable &middot; S silhouette &middot; L fills &middot; R reset &middot; G gallery</div>
  <div id="toast"></div>
  <script type="module" src="../src/modelviewer/main.js"></script>
</body>
</html>
