<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lookdev — The Gateless Gate</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F3EDDF; }
    #hud { position: fixed; top: 8px; left: 10px; z-index: 9;
           font: 12px/1.5 system-ui, sans-serif; color: #3a352c; white-space: pre; }
    #hud b { font-weight: 600; }
  </style>
</head>
<body>
  <div id="hud">lookdev — lk.treatment('ink'|'natural') · lk.shot('name') · lk.step(n)</div>
  <script type="module">
    import * as THREE from '../lib/three.module.js';
    import { PAPER, INK } from '../src/palette.js';
    import {
      composeWorld, makePath, makeLantern, makeMonk, aimMonk, makeGate, makeFlag,
      makeBlobShadow, addOutlines, setInkScale, makeGrassField,
    } from '../src/kit/index.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 300);

    // ---- the same staging as case 29, so the A/B is honest -------------------
    const path = makePath({ from: [1.4, 9], to: [1.4, -34], width: 1.8, seed: 91, groundSeed: 21, wander: 1.3 });
    scene.add(path);

    const gp = path.sample(0.27);
    const gate = makeGate({});
    gate.position.set(gp.x, 0, gp.z);
    gate.rotation.y = gp.heading;
    scene.add(gate);

    const lw = 1.55;
    const lanternA = makeLantern({});
    lanternA.position.set(gp.x + gp.perp.x * lw, 0, gp.z + gp.perp.z * lw);
    const lanternB = makeLantern({ height: 1.0 });
    lanternB.position.set(gp.x - gp.perp.x * lw, 0, gp.z - gp.perp.z * lw);
    scene.add(lanternA, lanternB);

    const mp = path.sample(0.17);
    const flag = makeFlag({ seed: 11 });
    flag.group.position.set(mp.x + mp.perp.x * 2.4, 0, mp.z + mp.perp.z * 2.4 + 0.6);
    scene.add(flag.group);

    const monkA = makeMonk({ pose: 'point' });
    monkA.position.set(mp.x + mp.perp.x * 0.6, 0, mp.z + mp.perp.z * 0.6);
    aimMonk(monkA, flag.group.position);
    const monkB = makeMonk({ stout: 1.12 });
    monkB.position.set(mp.x - mp.perp.x * 0.8, 0, mp.z - mp.perp.z * 0.8);
    aimMonk(monkB, monkA.position);
    scene.add(monkA, monkB);

    composeWorld(scene, {
      seed: 29, groundSeed: 21,
      keepout: [
        { x: mp.x, z: mp.z, r: 3.0 }, { x: gp.x, z: gp.z, r: 3.6 },
        { x: flag.group.position.x, z: flag.group.position.z, r: 1.4 },
        { x: 1.4, z: -12, r: 3.4 }, { x: 1.4, z: 6, r: 2.8 },
      ],
    });

    // the new dense field, staged alongside the authored clump tufts so we can A/B.
    // The road is a ribbon, so mask it with a chain of circles sampled along it —
    // otherwise grass grows straight through the trail.
    // ONLY the worn trail masks the grass. Circles around props (flagpole, monks,
    // gate) stamped obvious bald patches in the turf — grass grows right up to a
    // pole in life, so let it.
    const grassKeepout = [];
    for (let i = 0; i <= 26; i++) {
      const sp = path.sample(i / 26);
      grassKeepout.push({ x: sp.x, z: sp.z, r: 1.15 });
    }
    const grass = makeGrassField({
      count: 44000, radius: 17, height: 0.34, width: 0.05,
      color: '#84875F', seed: 5, groundSeed: 21, keepout: grassKeepout,
    });
    scene.add(grass.mesh);
    function useGrassField(on) {
      grass.mesh.visible = !!on;
      scene.traverse((o) => { if (o.name === 'grass') o.visible = !on; }); // old clump tufts
      updateHud(); render();
      return on ? `field: ${grass.blades} blades` : 'clump tufts';
    }

    for (const [p, rx, rz, op] of [
      [monkA.position, 0.7, 0.55, 0.42], [monkB.position, 0.7, 0.55, 0.42],
      [gate.position, 1.8, 0.75, 0.32], [flag.group.position, 0.55, 0.45, 0.36],
      [lanternA.position, 0.35, 0.3, 0.3], [lanternB.position, 0.35, 0.3, 0.3],
    ]) {
      const s = makeBlobShadow({ radiusX: rx, radiusZ: rz, opacity: op });
      s.position.x = p.x; s.position.z = p.z;
      scene.add(s);
    }

    addOutlines(scene, { width: 0.035, wobble: 0.7 });
    // the app now mounts with a hairline hull ON (inkWidth 0.1 — debug.js
    // v6), but this harness's treatments toggle outline visibility by hand
    // and were authored around a real stroke — pin the scale up so those
    // toggles still show one
    setInkScale(1);

    // ---- treatment machinery -------------------------------------------------
    const originals = new Map();   // mesh -> its authored (toon) material
    scene.traverse((o) => { if (o.isMesh && !o.userData.isOutline) originals.set(o, o.material); });

    const inkColor = new THREE.Color(INK);
    const LIFTED = new THREE.Color('#3C3844');    // dark warm charcoal: still ink-ish, but form can read
    function liftedColor(c) {
      return c.getHex() === inkColor.getHex() ? LIFTED.clone() : c.clone();
    }
    const standards = new Map();
    function toStandard(mesh) {
      if (standards.has(mesh)) return standards.get(mesh);
      const o = originals.get(mesh);
      const m = new THREE.MeshStandardMaterial({
        color: liftedColor(o.color),
        roughness: 0.93, metalness: 0.0,
        side: o.side, flatShading: !!o.flatShading,
        transparent: !!o.transparent, opacity: o.opacity ?? 1,
      });
      m.fog = o.fog;
      standards.set(mesh, m);
      return m;
    }

    // shadows are an INDEPENDENT axis from the treatment, so ink can have them too
    function configureShadow(light) {
      light.shadow.mapSize.set(2048, 2048);
      light.shadow.camera.near = 0.5; light.shadow.camera.far = 70;
      Object.assign(light.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28 });
      light.shadow.bias = -0.0006;
      light.shadow.normalBias = 0.02;
      return light;
    }

    // lights: the authored pair vs a key+sky rig that actually models form
    const inkLights = new THREE.Group();
    inkLights.name = 'inkLights';
    const inkSun = configureShadow(new THREE.DirectionalLight(0xffffff, 2.5));
    inkSun.position.set(4, 7, 3);
    // 0.16, not the authored 0.38: a flat fill that high leaves shadows nowhere to go
    const inkAmbient = new THREE.AmbientLight(0xffffff, 0.16);
    inkLights.add(inkSun, inkAmbient);

    const natLights = new THREE.Group();
    natLights.name = 'natLights';
    const keyLight = configureShadow(new THREE.DirectionalLight(0xfff2df, 2.6));
    keyLight.position.set(9, 13, 7);
    natLights.add(keyLight, new THREE.HemisphereLight(0xdfe6f0, 0xb9ae95, 1.05));

    // a soft vertical sky instead of one flat paper tone
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(160, 24, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false, fog: false,
        uniforms: { uTop: { value: new THREE.Color('#DCE3EC') }, uBot: { value: new THREE.Color('#F3EDDF') } },
        vertexShader: 'varying float vH; void main(){ vH = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
        fragmentShader: 'uniform vec3 uTop; uniform vec3 uBot; varying float vH; void main(){ gl_FragColor = vec4(mix(uBot,uTop,smoothstep(-0.05,0.55,vH)),1.0); }',
      }));
    sky.name = 'sky';
    sky.visible = false;
    scene.add(sky);

    let current = null;
    let shadowsOn = false;

    function treatment(name) {
      const natural = name === 'natural';
      current = natural ? 'natural' : 'ink';

      scene.traverse((o) => {
        if (o.userData.isOutline) o.visible = !natural;              // ink contours
        if (o.isMesh && originals.has(o)) {
          o.material = natural ? toStandard(o) : originals.get(o);
        }
      });

      sky.visible = natural;
      scene.background = natural ? null : new THREE.Color(PAPER);
      scene.fog = natural
        ? new THREE.FogExp2('#E8E6DE', 0.019)
        : new THREE.FogExp2(PAPER, 0.03);

      scene.remove(inkLights, natLights);
      scene.add(natural ? natLights : inkLights);
      shadows(shadowsOn);        // re-apply the independent shadow state
      return current;
    }

    // real shadow maps, on either treatment. Painted blob decals step aside when on.
    function shadows(on) {
      shadowsOn = !!on;
      renderer.shadowMap.enabled = shadowsOn;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      inkSun.castShadow = shadowsOn;
      keyLight.castShadow = shadowsOn;
      scene.traverse((o) => {
        if (o.name === 'blobshadow') o.visible = !shadowsOn;
        if (o.isMesh && originals.has(o)) {
          const isGround = o.name === 'ground';
          o.castShadow = shadowsOn && !isGround;
          o.receiveShadow = shadowsOn;
        }
      });
      updateHud();
      render();
      return shadowsOn;
    }

    // --- self-diagnostics: prove which build is running and surface any GL error ---
    const BUILD = 'grass-v2';
    const GPU = (() => {
      try {
        const gl = renderer.getContext();
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        return String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)).slice(0, 60);
      } catch { return 'unknown'; }
    })();
    let lastError = '';
    addEventListener('error', (e) => { lastError = String(e.message).slice(0, 200); updateHud(); });
    const _consoleError = console.error;
    console.error = (...a) => {          // three.js reports shader compile failures here
      lastError = String(a[0]).slice(0, 200);
      _consoleError.apply(console, a);
      try { updateHud(); } catch {}
    };

    function updateHud() {
      const outlinesOn = (() => {
        let v = false; scene.traverse((o) => { if (o.userData.isOutline && o.visible) v = true; }); return v;
      })();
      document.getElementById('hud').innerHTML =
        `treatment <b>${current}</b> · shadows <b>${shadowsOn ? 'on' : 'off'}</b>` +
        ` · grass <b>${grass.mesh.visible ? `field (${grass.mesh.count})` : 'tufts'}</b>` +
        ` · outlines <b>${outlinesOn ? 'on' : 'off'}</b>\n` +
        `[t] treatment   [s] shadows   [g] grass   [o] outlines   [w] wind\n` +
        `build <b>${BUILD}</b> · gpu ${GPU}` +
        (lastError ? `\n<b style="color:#a33">ERROR:</b> ${lastError}` : '');
    }

    let simTime = 0;
    function render() { renderer.render(scene, camera); }
    function step(n = 1) {
      for (let i = 0; i < n; i++) {
        simTime += 1 / 60;
        flag.update(1 / 60, simTime);
        grass.update(1 / 60, simTime);
      }
      render();
    }
    async function shot(name = 'lookdev') {
      const url = renderer.domElement.toDataURL('image/jpeg', 0.88);
      try {
        const r = await fetch('http://localhost:8106/' + name, { method: 'POST', body: url });
        return await r.text();
      } catch (e) { return 'post-failed: ' + e.message; }
    }
    function view(px, py, pz, tx, ty, tz) {
      camera.position.set(px, py, pz); camera.lookAt(tx, ty, tz); render();
    }

    window.lk = { renderer, scene, camera, treatment, shadows, grass: useGrassField, grassField: grass, step, shot, view, inkSun, keyLight, sky, THREE };

    // keys, so none of this needs the console
    let windLevel = 1;
    addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'g') useGrassField(!grass.mesh.visible);
      else if (k === 's') shadows(!shadowsOn);
      else if (k === 't') treatment(current === 'ink' ? 'natural' : 'ink');
      else if (k === 'o') {
        scene.traverse((o) => { if (o.userData.isOutline) o.visible = !o.visible; });
        updateHud(); render();
      } else if (k === 'w') {
        windLevel = windLevel >= 3 ? 0 : windLevel + 1;
        grass.setWind(windLevel);
      }
    });

    view(7.2, 4.6, 9.4, 1.2, 1.35, 0.3);   // the koan framing
    useGrassField(true);                    // show the new field on load
    treatment('ink');
    shadows(false);   // the 2k map is too coarse against ink — [s] to compare
    let t0 = performance.now();
    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
      simTime += dt; flag.update(dt, simTime); grass.update(dt, simTime); render();
    })(performance.now());
    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
